[build-system]
requires = ["setuptools>=84.2", "wheel>=0.48"]
build-backend = "setuptools.build_meta"

[project]
name = "calibre-web2rag"
version = "0.2.3"
description = "RAG ingester for Calibre Web libraries into Qdrant"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "qdrant-client>=1.20.0",
  "pypdf>=7.0.1",
  "ebooklib>=0.21",
  "beautifulsoup4>=4.15.0",
  "mobi>=0.4.1",
  "python-dotenv>=1.2.4",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
sentence-transformers = [
  "sentence-transformers>=6.3.0",
]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.4",
]

[project.scripts]
calibre-web2rag = "calibre_web2rag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["calibre_web2rag"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
