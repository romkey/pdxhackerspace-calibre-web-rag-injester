# Development: runs the ingester from your working tree, with the dev
# dependencies installed, against a local Qdrant.
#
#   cp .env.example .env              # then edit it
#   docker compose up --build         # ingest the library once
#   docker compose run --rm app bash  # a shell with everything installed
#
# Add Ollama (GPU) embeddings with the override file:
#
#   docker compose -f docker-compose.yaml -f docker-compose.ollama.yaml up --build
#
# Tests, lint and production have their own compose files:
#
#   docker compose -f docker-compose.test.yaml run --rm test
#   docker compose -f docker-compose.lint.yaml run --rm lint
#   docker compose -f docker-compose.prod.yaml up -d

services:
  app:
    build:
      context: .
      target: dev
    # uv run re-syncs /venv if pyproject.toml or uv.lock changed.
    command: uv run --locked calibre-web2rag
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
      - ${CALIBRE_LIBRARY_ROOT:-/data/calibre}:${CALIBRE_LIBRARY_ROOT:-/data/calibre}:ro
      - ${HF_CACHE_HOST_DIR:-./.cache/huggingface}:${HF_CACHE_DIR:-/hf-cache}
    depends_on:
      qdrant:
        condition: service_started
    # On SIGTERM it finishes the file it is embedding (requests can take up
    # to OPENAI_TIMEOUT_SECONDS each) and upserts; don't SIGKILL it at 10s.
    stop_grace_period: 5m

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  uv-cache:
  qdrant-data:
