# Development: runs the ingester from your working tree, with the dev
# dependencies installed, against a local Qdrant and PostgreSQL.
#
#   cp .env.example .env              # then edit it
#   docker compose up --build         # migrate, then one full sync
#   docker compose run --rm app uv run calibre-web2rag run --mode incremental
#   docker compose run --rm app bash  # a shell with everything installed
#
# Add Ollama (GPU) embeddings with the override file:
#
#   docker compose -f docker-compose.yaml -f docker-compose.ollama.yaml up --build
#
# Tests, lint and production have their own compose files:
#
#   docker compose -f docker-compose.test.yaml run --rm test
#   docker compose -f docker-compose.lint.yaml run --rm lint
#   docker compose -f docker-compose.prod.yaml up -d

services:
  app:
    build:
      context: .
      target: dev
    # uv run re-syncs /venv if pyproject.toml or uv.lock changed.
    command:
      - sh
      - -c
      - uv run --locked calibre-web2rag migrate && uv run --locked calibre-web2rag run --mode full
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://app:app@db:5432/app  # not-a-secret: local dev only
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
      - ${CALIBRE_LIBRARY_ROOT:-/data/calibre}:${CALIBRE_LIBRARY_ROOT:-/data/calibre}:ro
      - ${HF_CACHE_HOST_DIR:-./.cache/huggingface}:${HF_CACHE_DIR:-/hf-cache}
    depends_on:
      qdrant:
        condition: service_started
      db:
        condition: service_healthy
    # On SIGTERM it finishes the book it is reading (requests can take up
    # to OPENAI_TIMEOUT_SECONDS each) and upserts; don't SIGKILL it at 10s.
    stop_grace_period: 5m

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  db:
    image: postgres:18-trixie
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app  # not-a-secret: local dev only
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  uv-cache:
  qdrant-data:
  db-data:
