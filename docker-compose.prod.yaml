# Production: runs the released image from ghcr.io with Qdrant and
# PostgreSQL. Configure it in .env next to this file (see .env.example and
# docs/configuration.md).
#
#   docker compose -f docker-compose.prod.yaml up -d      # one full sync
#   APP_VERSION=1.2.3 docker compose -f docker-compose.prod.yaml up -d   # pin a release
#   docker compose -f docker-compose.prod.yaml build      # build the image locally instead
#
# The ingester is a batch job: each run syncs the library and exits, so it
# has no port, no health check and doesn't restart. Schedule it from cron:
#
#   # hourly: changed and deleted books; nightly: full reconcile
#   5 * * * * cd /srv/c2r && docker compose -f docker-compose.prod.yaml run --rm app calibre-web2rag --mode incremental
#   30 3 * * * cd /srv/c2r && docker compose -f docker-compose.prod.yaml run --rm app calibre-web2rag --mode full
#
# Each run applies any pending database migrations before it syncs.
# Overlapping runs are safe: a second run finds the lock held and exits.

services:
  app:
    image: ghcr.io/romkey/pdxhackerspace-calibre-web-rag-injester:${APP_VERSION:-latest}
    build:
      context: .
      target: production
    command: ["calibre-web2rag", "run", "--mode", "full"]
    restart: "no"
    # On SIGTERM it finishes the book it is reading (requests can take up
    # to OPENAI_TIMEOUT_SECONDS each) and upserts; don't SIGKILL it at 10s.
    stop_grace_period: 5m
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ${CALIBRE_LIBRARY_ROOT:-/data/calibre}:${CALIBRE_LIBRARY_ROOT:-/data/calibre}:ro
    depends_on:
      qdrant:
        condition: service_healthy
      db:
        condition: service_healthy
    # Least privilege: nothing to write but /tmp, no capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # No ports: only the ingester (and other pipeline jobs on this network)
  # reach it. Back up the db-data volume.
  db:
    image: postgres:18-trixie
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  qdrant-data:
  db-data:
